<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 번역/요약 시스템</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; color: #333; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #2c3e50; }
        .subtitle { color: #7f8c8d; margin-bottom: 30px; font-size: 0.95rem; }

        .card { background: #fff; border-radius: 10px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 28px; }
        .card h2 { font-size: 1.1rem; margin-bottom: 20px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }

        .form-row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: #555; }
        input[type="file"] { border: 1px solid #ddd; border-radius: 6px; padding: 8px 12px; font-size: 0.9rem; background: #fafafa; cursor: pointer; }
        select { border: 1px solid #ddd; border-radius: 6px; padding: 9px 14px; font-size: 0.9rem; background: #fafafa; cursor: pointer; }
        button[type="submit"] {
            background: #3498db; color: #fff; border: none; border-radius: 6px;
            padding: 10px 24px; font-size: 0.95rem; cursor: pointer; font-weight: 600;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background: #2980b9; }

        .alert { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 6px; padding: 12px 16px; margin-bottom: 20px; font-size: 0.9rem; }

        .uploading { display: none; margin-top: 16px; color: #3498db; font-size: 0.9rem; font-weight: 600; }
        .uploading.active { display: flex; align-items: center; gap: 10px; }
        .spinner { width: 18px; height: 18px; border: 3px solid #ddd; border-top-color: #3498db; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        thead tr { background: #f0f4f8; }
        th { padding: 12px 14px; text-align: left; font-weight: 600; color: #555; }
        td { padding: 12px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafcff; }

        .lang-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; background: #eaf4fb; color: #2980b9; }
        .summary-cell { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #555; }
        .btn-detail { background: #ecf0f1; color: #2c3e50; border: none; border-radius: 5px; padding: 5px 14px; font-size: 0.82rem; cursor: pointer; text-decoration: none; font-weight: 600; }
        .btn-detail:hover { background: #d5dbdb; }
        .empty { text-align: center; color: #aaa; padding: 40px 0; font-size: 0.95rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>PDF 번역/요약 시스템</h1>
    <p class="subtitle">영어·일본어·중국어 PDF를 업로드하면 한국어로 번역하고 요약합니다.</p>

    <div class="card">
        <h2>PDF 업로드</h2>

        <div th:if="${message}" class="alert" th:text="${message}"></div>

        <form method="post" action="/upload" enctype="multipart/form-data" id="uploadForm">
            <div class="form-row">
                <div class="form-group">
                    <label>PDF 파일</label>
                    <input type="file" name="file" accept=".pdf" required>
                </div>
                <div class="form-group">
                    <label>원본 언어</label>
                    <select name="sourceLang">
                        <option value="EN">영어 (EN)</option>
                        <option value="JA">일본어 (JA)</option>
                        <option value="ZH">중국어 (ZH)</option>
                    </select>
                </div>
                <button type="submit">번역 &amp; 요약 시작</button>
            </div>
            <div class="uploading" id="uploadingMsg">
                <div class="spinner"></div>
                <span>번역 및 요약 처리 중입니다. 잠시 기다려주세요...</span>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>처리된 문서 목록</h2>
        <div th:if="${#lists.isEmpty(documents)}" class="empty">아직 업로드된 문서가 없습니다.</div>
        <table th:unless="${#lists.isEmpty(documents)}">
            <thead>
            <tr>
                <th>#</th>
                <th>파일명</th>
                <th>언어</th>
                <th>요약</th>
                <th>상세</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="doc : ${documents}">
                <td th:text="${doc.id}"></td>
                <td th:text="${doc.fileName}"></td>
                <td><span class="lang-badge" th:text="${doc.originLang}"></span></td>
                <td class="summary-cell" th:text="${doc.summary}"></td>
                <td><a class="btn-detail" th:href="@{/detail/{id}(id=${doc.id})}">보기</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', function () {
        document.getElementById('uploadingMsg').classList.add('active');
    });
</script>
</body>
</html>
