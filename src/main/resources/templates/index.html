<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 번역/요약 시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body th:data-has-processing="${hasProcessing}">
<div class="container">
    <h1>PDF 번역/요약 시스템</h1>
    <p class="subtitle">영어·일본어·중국어 PDF를 업로드하면 한국어로 번역하고 요약합니다.</p>

    <div class="card">
        <h2>PDF 업로드</h2>

        <div th:if="${message}" class="alert" th:text="${message}"></div>

        <form method="post" action="/upload" enctype="multipart/form-data" id="uploadForm">
            <div class="form-row">
                <div class="form-group">
                    <label>PDF 파일</label>
                    <input type="file" name="file" accept=".pdf" required>
                </div>
                <div class="form-group" style="max-width:160px;">
                    <label>원본 언어</label>
                    <select name="sourceLang">
                        <option value="EN">영어</option>
                        <option value="JA">일본어</option>
                        <option value="ZH">중국어</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="submit" name="processMode" value="TRANSLATE" class="btn-submit btn-translate">번역</button>
                    <button type="submit" name="processMode" value="SUMMARIZE" class="btn-submit btn-summarize">요약</button>
                    <button type="submit" name="processMode" value="BOTH" class="btn-submit btn-both">번역 / 요약</button>
                </div>
            </div>
            <p class="notice-time">⏱ [번역 / 요약]은 문서 길이에 따라 약 10~20분 이상 소요될 수 있습니다.</p>
            <div class="uploading" id="uploadingMsg">
                <div class="spinner"></div>
                <span>업로드 중입니다...</span>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>처리된 문서 목록</h2>
        <div th:if="${#lists.isEmpty(documents)}" class="empty">아직 업로드된 문서가 없습니다.</div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(documents)}">
            <table>
                <thead>
                <tr>
                    <th>파일명</th>
                    <th class="col-lang">언어</th>
                    <th class="col-mode">모드</th>
                    <th class="col-status">상태</th>
                    <th class="col-action"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="doc : ${documents}"
                    th:class="${doc.status.name() == 'FAILED'} ? 'row-failed' : ''">
                    <td>
                        <div style="font-weight:600;color:#1a2b4a;font-size:0.9rem;" th:text="${doc.fileName}"></div>
                        <div class="meta-text" th:text="${#temporals.format(doc.createdAt, 'MM-dd HH:mm')}"></div>
                    </td>
                    <td style="font-size:0.84rem;color:#475569;font-weight:500;white-space:nowrap;"
                        th:text="${doc.originLang == 'EN' ? '영어' : (doc.originLang == 'JA' ? '일본어' : '중국어')}"></td>
                    <td style="font-size:0.82rem;color:#64748b;white-space:nowrap;"
                        th:text="${doc.processMode?.displayName}"></td>
                    <td>
                        <span th:class="'badge badge-' + ${doc.status.name().toLowerCase()}"
                              th:text="${doc.status.displayName}"></span>
                    </td>
                    <td class="col-action" style="text-align:right;">
                        <!-- PROCESSING: 진행 상태 텍스트 (링크 없음) -->
                        <th:block th:if="${doc.status.name() == 'PROCESSING'}">
                            <span class="processing-label"
                                  th:text="${doc.processMode?.name() == 'TRANSLATE' ? '번역중...' : (doc.processMode?.name() == 'SUMMARIZE' ? '요약중...' : '번역+요약중...')}"></span>
                        </th:block>
                        <!-- 그 외: 보기 버튼 -->
                        <th:block th:unless="${doc.status.name() == 'PROCESSING'}">
                            <a class="btn-view" th:href="@{/detail/{id}(id=${doc.id})}">상세보기</a>
                            <form th:if="${doc.status.name() == 'FAILED'}"
                                  th:action="@{/retry/{id}(id=${doc.id})}"
                                  method="post"
                                  style="display:inline;">
                                <button type="submit" class="btn-retry">재시도</button>
                            </form>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/js/index.js}"></script>
</body>
</html>
