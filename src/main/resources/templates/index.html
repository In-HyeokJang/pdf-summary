<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 번역/요약 시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body th:data-has-processing="${hasProcessing}">
<div class="container">
    <h1>PDF 번역/요약 시스템</h1>
    <p class="subtitle">영어·일본어·중국어 PDF를 업로드하면 한국어로 번역하고 요약합니다.</p>

    <div class="card">
        <h2>PDF 업로드</h2>

        <div th:if="${message}" class="alert" th:text="${message}"></div>

        <form method="post" action="/upload" enctype="multipart/form-data" id="uploadForm">
            <div class="form-row">
                <div class="form-group">
                    <label>PDF 파일</label>
                    <input type="file" name="file" accept=".pdf" required>
                </div>
                <div class="form-group" style="max-width:160px;">
                    <label>원본 언어</label>
                    <select name="sourceLang">
                        <option value="EN">영어 (EN)</option>
                        <option value="JA">일본어 (JA)</option>
                        <option value="ZH">중국어 (ZH)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="submit" name="processMode" value="TRANSLATE" class="btn-submit btn-translate">번역</button>
                    <button type="submit" name="processMode" value="SUMMARIZE" class="btn-submit btn-summarize">요약</button>
                    <button type="submit" name="processMode" value="BOTH" class="btn-submit btn-both">번역 / 요약</button>
                </div>
            </div>
            <p class="notice-time">⏱ [번역 / 요약]은 문서 길이에 따라 약 5분 이상 소요될 수 있습니다.</p>
            <div class="uploading" id="uploadingMsg">
                <div class="spinner"></div>
                <span>업로드 중입니다...</span>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>처리된 문서 목록</h2>
        <div th:if="${#lists.isEmpty(documents)}" class="empty">아직 업로드된 문서가 없습니다.</div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(documents)}">
            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th>파일명</th>
                    <th>언어</th>
                    <th>모드</th>
                    <th>상태</th>
                    <th>요약</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="doc : ${documents}"
                    th:class="${doc.status.name() == 'FAILED'} ? 'row-failed' : ''">
                    <td th:text="${doc.id}" style="color:#94a3b8;width:40px;"></td>
                    <td th:text="${doc.fileName}" style="font-weight:600;"></td>
                    <td><span class="lang-badge" th:text="${doc.originLang}"></span></td>
                    <td th:text="${doc.processMode?.name()}" style="font-size:0.8rem;color:#64748b;"></td>
                    <td>
                        <span th:class="'badge badge-' + ${doc.status.name().toLowerCase()}"
                              th:text="${doc.status.name()}"></span>
                    </td>
                    <td class="summary-cell" th:text="${doc.summary}"></td>
                    <td style="white-space:nowrap;">
                        <a class="btn-view" th:href="@{/detail/{id}(id=${doc.id})}">보기</a>
                        <form th:if="${doc.status.name() == 'FAILED'}"
                              th:action="@{/retry/{id}(id=${doc.id})}"
                              method="post"
                              style="display:inline;">
                            <button type="submit" class="btn-retry">재시도</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/js/index.js}"></script>
</body>
</html>
