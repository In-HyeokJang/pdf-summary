<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'문서 상세 - ' + ${doc.fileName}">문서 상세</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; color: #333; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }

        .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .btn-back { background: #ecf0f1; color: #2c3e50; border: none; border-radius: 6px; padding: 8px 18px; font-size: 0.88rem; cursor: pointer; text-decoration: none; font-weight: 600; }
        .btn-download { background: #27ae60; color: #fff; border: none; border-radius: 6px; padding: 8px 18px; font-size: 0.88rem; cursor: pointer; text-decoration: none; font-weight: 600; }
        .btn-download:hover { background: #219a52; }
        .btn-back:hover { background: #d5dbdb; }
        h1 { font-size: 1.4rem; color: #2c3e50; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .meta { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
        .meta-item { background: #eaf4fb; color: #2980b9; border-radius: 20px; padding: 4px 14px; font-size: 0.82rem; font-weight: 600; }

        .card { background: #fff; border-radius: 10px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px; }
        .card h2 { font-size: 1.05rem; margin-bottom: 16px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }

        .summary-box { background: #f0f7ff; border-left: 4px solid #3498db; border-radius: 4px; padding: 16px 20px; font-size: 0.95rem; line-height: 1.9; color: #2c3e50; white-space: pre-wrap; }
        .summary-box strong { color: #1a5276; font-size: 1rem; }
        .text-box { font-size: 0.88rem; line-height: 1.9; color: #444; white-space: pre-wrap; max-height: 480px; overflow-y: auto; padding: 4px 0; }

        .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; }
        .tab { background: #ecf0f1; border: none; border-radius: 6px 6px 0 0; padding: 8px 20px; font-size: 0.88rem; cursor: pointer; font-weight: 600; color: #7f8c8d; }
        .tab.active { background: #3498db; color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <a class="btn-back" href="/">← 목록으로</a>
        <a class="btn-download" th:href="@{/download/{id}(id=${doc.id})}">⬇ PDF 다운로드</a>
        <h1 th:text="${doc.fileName}"></h1>
    </div>

    <div class="meta">
        <span class="meta-item" th:text="'원본 언어: ' + ${doc.originLang}"></span>
        <span class="meta-item" th:text="'업로드: ' + ${#temporals.format(doc.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
    </div>

    <div class="card">
        <h2>요약</h2>
        <div class="summary-box" th:text="${doc.summary}"></div>
    </div>

    <div class="card">
        <h2>번역 전문</h2>
        <div class="tab-bar">
            <button class="tab active" onclick="switchTab('translated')">한국어 번역</button>
        </div>
        <div id="translated" class="tab-content active">
            <div class="text-box" th:text="${doc.translatedText}"></div>
        </div>
    </div>
</div>

<script>
    function switchTab(id) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }
</script>
</body>
</html>
