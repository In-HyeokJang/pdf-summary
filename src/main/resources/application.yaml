spring:
  application:
    name: pdf-summary

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  lifecycle:
    timeout-per-shutdown-phase: 10m

server:
  shutdown: graceful
  servlet:
    session:
      tracking-modes: cookie

vllm:
  translation-concurrency: 10
  summary-chunk-size: 5000
  summary-concurrency: 4
  stale-timeout-minutes: 30