spring:
  application:
    name: pdf-summary

  config:
    import: optional:classpath:application-local.yaml

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/pdf_summary?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  servlet:
    session:
      tracking-modes: cookie

vllm:
  base-url: ${VLLM_BASE_URL:http://localhost:8000}
  model: ${VLLM_MODEL:Qwen/Qwen2.5-14B-Instruct}